<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Vinil no Spotify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vinyl-spin {
            animation: spin 3s linear infinite;
        }

        .vinyl-paused {
            animation-play-state: paused;
        }

        /* Efeito de ranhuras no vinil */
        .vinyl-grooves {
            background: repeating-radial-gradient(
                circle,
                #111 0px,
                #111 2px,
                #222 3px,
                #111 4px
            );
        }

        /* Sombra e brilho realista para o vinil */
        .vinyl-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6 selection:bg-emerald-500 selection:text-white">

    <!-- Cabeçalho -->
    <header class="w-full max-w-md flex justify-between items-center py-4">
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-emerald-500" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.721.48-1.08.24-2.999-1.84-6.78-2.259-11.22-1.24-.42.12-.84-.12-.96-.54-.12-.42.12-.84.54-.96 4.86-1.14 9.06-.66 12.48 1.56.36.24.48.72.24 1.04zm1.5-3.36c-.3.42-.9.54-1.32.24-3.42-2.1-8.64-2.71-12.66-1.47-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.56-1.38 10.44-.66 14.46 1.86.42.3.54.9.24 1.35zm.12-3.54C15.12 8.28 8.82 8.04 5.16 9.15c-.66.2-1.38-.18-1.58-.84-.2-.66.18-1.38.84-1.58 4.2-1.26 11.22-.96 15.6 1.68.6.36.78 1.14.42 1.74-.36.6-1.14.78-1.74.42z"/>
            </svg>
            <span class="font-bold tracking-wider text-sm">SPOTIFY VINYL</span>
        </div>
        <div id="auth-status" class="text-xs text-slate-400">Não conectado</div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="w-full max-w-md flex flex-col items-center justify-center my-auto">
        
        <!-- Tela de Login -->
        <div id="login-screen" class="text-center flex flex-col items-center gap-6">
            <div class="w-24 h-24 bg-slate-900 rounded-full flex items-center justify-center border border-slate-800 shadow-xl">
                <svg class="w-12 h-12 text-emerald-500 animate-pulse" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold mb-2">Seu Tocador de Vinil</h1>
                <p class="text-slate-400 text-sm max-w-xs">Conecte sua conta do Spotify para ver a capa do seu álbum favorito ganhar vida em um disco giratório.</p>
            </div>
            <button id="login-btn" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold px-6 py-3 rounded-full transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
                Conectar ao Spotify
            </button>
        </div>

        <!-- Tela do Player (Oculta por padrão) -->
        <div id="player-screen" class="hidden w-full flex flex-col items-center gap-8">
            
            <!-- Palco do Vinil -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
                <!-- Braço do Tocador -->
                <div id="tonearm" class="absolute -top-4 right-4 w-16 h-32 origin-top-right transition-transform duration-500 z-30 pointer-events-none" style="transform: rotate(25deg);">
                    <div class="w-3 h-28 bg-gradient-to-b from-slate-300 to-slate-400 rounded-full shadow-md ml-auto"></div>
                    <div class="w-6 h-6 bg-slate-200 rounded-full absolute top-0 right-0 shadow"></div>
                    <div class="w-4 h-6 bg-slate-700 rounded-sm absolute bottom-0 right-[-2px] shadow-sm"></div>
                </div>

                <!-- O Disco de Vinil -->
                <div id="vinyl-disc" class="w-full h-full rounded-full vinyl-grooves vinyl-shadow vinyl-spin vinyl-paused flex items-center justify-center relative border-4 border-slate-900">
                    <!-- Capa do Álbum no Selo Central -->
                    <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full overflow-hidden border-2 border-slate-700 shadow-inner relative flex items-center justify-center bg-slate-900">
                        <img id="album-art" src="" alt="Capa do Álbum" class="w-full h-full object-cover">
                        <!-- Furo Central do Vinil -->
                        <div class="absolute w-4 h-4 bg-slate-950 rounded-full border border-slate-700"></div>
                    </div>
                </div>
            </div>

            <!-- Informações da Música -->
            <div class="text-center w-full px-4">
                <div id="track-name" class="text-lg font-bold truncate text-slate-100">Nenhuma música tocando</div>
                <div id="artist-name" class="text-sm text-slate-400 truncate mt-1">Abra o Spotify e dê play</div>
            </div>

            <!-- Botão de Sair -->
            <button id="logout-btn" class="text-xs text-slate-500 hover:text-slate-300 underline transition-colors">
                Desconectar conta
            </button>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="w-full max-w-md text-center text-xs text-slate-600 py-4">
        Hospedado no GitHub Pages • API do Spotify
    </footer>

    <!-- Lógica JavaScript (PKCE + Player Polling) -->
    <script>
        // CONFIGURAÇÃO DO SPOTIFY
        const clientId = 'c17b8a32ee1249ef976034607a115409'; 
        
        // Pega automaticamente o redirecionamento atual (funciona local e no GitHub Pages)
        const redirectUri = window.location.origin + window.location.pathname;
        const scopes = 'user-read-playback-state user-read-currently-playing';

        const loginScreen = document.getElementById('login-screen');
        const playerScreen = document.getElementById('player-screen');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const authStatus = document.getElementById('auth-status');
        
        const vinylDisc = document.getElementById('vinyl-disc');
        const tonearm = document.getElementById('tonearm');
        const albumArt = document.getElementById('album-art');
        const trackName = document.getElementById('track-name');
        const artistName = document.getElementById('artist-name');

        let pollingInterval = null;

        // Geradores PKCE para segurança no Browser
        function generateRandomString(length) {
            let text = '';
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, [...new Uint8Array(digest)]))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        // Fluxo de Login
        loginBtn.addEventListener('click', async () => {
            const codeVerifier = generateRandomString(128);
            localStorage.setItem('code_verifier', codeVerifier);

            const codeChallenge = await generateCodeChallenge(codeVerifier);
            const state = generateRandomString(16);

            const authUrl = new URL('https://accounts.spotify.com/authorize');
            authUrl.searchParams.append('client_id', clientId);
            authUrl.searchParams.append('response_type', 'code');
            authUrl.searchParams.append('redirect_uri', redirectUri);
            authUrl.searchParams.append('state', state);
            authUrl.searchParams.append('scope', scopes);
            authUrl.searchParams.append('code_challenge_method', 'S256');
            authUrl.searchParams.append('code_challenge', codeChallenge);

            window.location.href = authUrl.toString();
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('token_expires_at');
            if (pollingInterval) clearInterval(pollingInterval);
            window.location.href = redirectUri.split('?')[0];
        });

        // Capturar código de redirecionamento do Spotify na URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // Limpa a URL para evitar reprocessar o código
            window.history.replaceState({}, document.title, window.location.pathname);
            exchangeCodeForToken(code);
        } else {
            checkExistingToken();
        }

        async function exchangeCodeForToken(code) {
            const codeVerifier = localStorage.getItem('code_verifier');
            if (!codeVerifier) return;

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: redirectUri,
                        code_verifier: codeVerifier,
                    }),
                });

                const data = await response.json();
                if (data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                    if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('token_expires_at', Date.now() + data.expires_in * 1000);
                    initPlayer();
                } else {
                    alert('Erro ao autenticar com o Spotify.');
                }
            } catch (err) {
                console.error('Erro na troca de token:', err);
            }
        }

        function checkExistingToken() {
            const token = localStorage.getItem('access_token');
            const expiresAt = localStorage.getItem('token_expires_at');

            if (token && expiresAt && Date.now() < parseInt(expiresAt)) {
                initPlayer();
            } else if (localStorage.getItem('refresh_token')) {
                // Tentar renovar token se houver refresh token
                refreshAccessToken();
            } else {
                showLogin();
            }
        }

        async function refreshAccessToken() {
            const refreshToken = localStorage.getItem('refresh_token');
            if (!refreshToken) {
                showLogin();
                return;
            }

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'refresh_token',
                        refresh_token: refreshToken,
                    }),
                });

                const data = await response.json();
                if (data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                    if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('token_expires_at', Date.now() + data.expires_in * 1000);
                    initPlayer();
                } else {
                    showLogin();
                }
            } catch (err) {
                console.error('Erro ao atualizar token:', err);
                showLogin();
            }
        }

        function showLogin() {
            loginScreen.classList.remove('hidden');
            playerScreen.classList.add('hidden');
            authStatus.textContent = 'Não conectado';
        }

        function initPlayer() {
            loginScreen.classList.add('hidden');
            playerScreen.classList.remove('hidden');
            authStatus.textContent = 'Conectado';

            // Buscar imediatamente e depois a cada 3 segundos
            fetchCurrentTrack();
            pollingInterval = setInterval(fetchCurrentTrack, 3000);
        }

        // Consultar música atual na API do Spotify
        async function fetchCurrentTrack() {
            const token = localStorage.getItem('access_token');
            if (!token) return;

            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 204 || response.status > 400) {
                    // Sem reprodução ativa ou erro de token
                    if (response.status === 401) {
                        refreshAccessToken();
                        return;
                    }
                    setIdleState('Nenhuma música ativa no momento');
                    return;
                }

                const data = await response.json();
                if (!data || !data.item) {
                    setIdleState('Nenhuma música tocando');
                    return;
                }

                const isPlaying = data.is_playing;
                const track = data.item;
                const songTitle = track.name;
                const artists = track.artists.map(a => a.name).join(', ');
                const albumImageUrl = track.album.images[0]?.url || '';

                // Atualizar elementos na tela
                trackName.textContent = songTitle;
                artistName.textContent = artists;
                if (albumImageUrl && albumArt.src !== albumImageUrl) {
                    albumArt.src = albumImageUrl;
                }

                // Controlar animação do disco e posição do braço
                if (isPlaying) {
                    vinylDisc.classList.remove('vinyl-paused');
                    tonearm.style.transform = 'rotate(0deg)';
                } else {
                    vinylDisc.classList.add('vinyl-paused');
                    tonearm.style.transform = 'rotate(25deg)';
                }

            } catch (err) {
                console.error('Erro ao buscar player:', err);
            }
        }

        function setIdleState(message) {
            trackName.textContent = message;
            artistName.textContent = 'Abra o Spotify em algum dispositivo';
            vinylDisc.classList.add('vinyl-paused');
            tonearm.style.transform = 'rotate(25deg)';
        }
    </script>
</body>
</html>
