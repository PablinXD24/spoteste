<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE TIMELESS • SPOTIFY VINYL</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&family=VT323&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pinkNeon: '#ff2a75',
                        yellowNeon: '#ffd600',
                        greenNeon: '#00ff66',
                        limeNeon: '#adff2f',
                        cyanNeon: '#00bfff',
                        purpleNeon: '#b19cd9'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --font-display: 'Syne', sans-serif;
            --font-data: 'Space Grotesk', sans-serif;
            --font-mono: 'VT323', monospace;
            --border-color: #000000;
            --box-shadow: 6px 6px 0px #000000;
            --box-shadow-sm: 4px 4px 0px #000000;
            --pink-neon: #ff2a75;
            --yellow-neon: #ffd600;
            --green-neon: #00ff66;
            --lime-neon: #adff2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #000000;
            color: #000;
            min-height: 100vh; 
            width: 100vw; 
            overflow-x: hidden;
            overflow-y: auto;
            font-family: var(--font-data);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start;
            transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.4s ease;
        }

        body.portal-closing {
            transform: scaleY(0.005) scaleX(1.2);
            opacity: 0;
            background-color: #000000 !important;
            filter: brightness(3) contrast(2);
        }

        .island-container {
            position: fixed; top: 12px; width: 100%; display: flex; justify-content: center; z-index: 9999; pointer-events: none; padding: 0 12px;
        }
        .island {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
            width: 100%; max-width: 220px; height: 42px;
            border-radius: 24px; pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            border: 2px solid var(--pink-neon);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 4px 20px rgba(255, 42, 117, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            cursor: pointer; position: relative;
        }
        .island.mini-active { width: 48px; height: 48px; border-radius: 50%; border-color: var(--green-neon); box-shadow: 0 0 15px rgba(0, 255, 102, 0.5); }
        .island.active { width: 100%; max-width: 380px; height: 85px; border-radius: 20px; border-color: var(--yellow-neon); box-shadow: 0 6px 30px rgba(255, 214, 0, 0.5); }
        .island.pulse { animation: islandPulse 0.5s ease; }
        .island.error { animation: shake 0.4s ease; background: linear-gradient(135deg, #ff2a75 0%, #8b0000 100%) !important; border-color: #fff !important; color: #fff; }

        @keyframes islandPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .island-content {
            width: 100%; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
            opacity: 0; transition: opacity 0.3s ease; position: absolute; pointer-events: none;
        }
        .island.active .island-content { opacity: 1; pointer-events: auto; }
        .island-mini-status { display: flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .island.active .island-mini-status { opacity: 0; transform: scale(0.5); }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pink-neon); border: 1px solid rgba(255,255,255,0.4); }
        .dot.online { background: var(--green-neon); box-shadow: 0 0 8px var(--green-neon); }
        .island-mini-status span { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 700; color: #fff; text-shadow: 0 0 5px rgba(0,255,102,0.5); }
        
        #island-mini-icon { display: none; font-size: 16px; color: var(--green-neon); filter: drop-shadow(0 0 5px var(--green-neon)); }
        .island.mini-active #island-mini-icon { display: block; }
        .island.mini-active .island-mini-status { display: none; }

        .island-info-text { display: flex; flex-direction: column; line-height: 1.2; flex: 1; margin-left: 12px; overflow: hidden; }
        .island-label { font-size: 0.7rem; color: var(--yellow-neon); font-weight: 700; text-transform: uppercase; font-family: var(--font-mono); letter-spacing: 1px; }
        .island-main { font-size: 0.95rem; font-weight: 800; color: #ffffff; font-family: var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

        .ambilight-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.15; background: repeating-linear-gradient(45deg, #222, #222 1px, transparent 1px, transparent 10px); transition: all 0.5s ease; }
        
        .app-container { 
            position: relative; 
            width: 100%; 
            min-height: 100vh; 
            z-index: 10; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 80px 16px 40px; 
        }

        .screen { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            min-height: 100vh; 
            display: none; 
            flex-direction: column; 
            padding: 80px 16px 40px; 
            justify-content: center; 
            align-items: center; 
        }
        .screen.active { display: flex; animation: slideUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        h1 { 
            font-family: var(--font-display); 
            font-size: clamp(2rem, 7vw, 4.5rem); 
            font-weight: 800; 
            line-height: 0.95; 
            letter-spacing: -1px; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            text-align: center; 
            color: #fff; 
        }
        p { font-size: 1rem; color: #fff; opacity: 0.85; margin-bottom: 20px; font-family: var(--font-data); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; text-align: center; }

        .input-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }

        .btn { 
            background: var(--yellow-neon); color: #000000; border: 4px solid var(--border-color); padding: 16px 20px; 
            border-radius: 0px; font-weight: 800; font-size: 1.1rem; font-family: var(--font-display); width: 100%; max-width: 400px; cursor: pointer; 
            box-shadow: var(--box-shadow); transition: 0.2s ease; text-transform: uppercase; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px #000000; background: var(--lime-neon); }
        .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000000; }
        .btn-outline { background: #ffffff; color: #000; }
        .btn-outline:hover { background: var(--pink-neon); color: #fff; }

        .brutal-card {
            background: #ffffff;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            border-radius: 0px;
            position: relative;
        }

        .player-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            gap: 20px;
            transition: all 0.4s ease;
        }

        .player-wrapper.split-active {
            max-width: 920px;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .player-wrapper.split-active {
                flex-direction: column;
                max-width: 440px;
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 20s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }
        .vinyl-grooves {
            background: repeating-radial-gradient(circle at center, #111 0px, #111 2px, #222 3px, #111 4px);
        }
        .vinyl-gold {
            background: repeating-radial-gradient(circle at center, #2a2200 0px, #2a2200 2px, #daa520 3px, #1a1400 4px);
        }
        .vinyl-cyber {
            background: repeating-radial-gradient(circle at center, #0b0f19 0px, #0b0f19 2px, #00f0ff 3px, #110022 4px);
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: #fff;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--pink-neon);
            width: 0%;
            transition: width 0.1s linear;
        }

        .lyrics-pane {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            height: 440px;
            background: #111;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            overflow: hidden;
            position: relative;
        }
        .lyrics-pane.active-split {
            display: flex;
        }

        #fullscreen-lyrics-modal {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000000;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #fullscreen-lyrics-modal.show {
            display: flex;
            opacity: 1;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--pink-neon); border: 2px solid #000; }

        .top-toolbar {
            position: fixed;
            top: 65px;
            width: 100%;
            max-width: 920px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            pointer-events: none;
        }
        .top-toolbar > * { pointer-events: auto; }
    </style>
</head>
<body>

<div class="ambilight-bg" id="ambilight"></div>

<div id="top-toolbar" class="top-toolbar" style="display: none;">
    <div class="brutal-card bg-white px-3 py-1.5 flex items-center space-x-2 font-black text-xs sm:text-sm shadow-[3px_3px_0px_#000]">
        <i class="fa-brands fa-spotify text-emerald-500 text-base"></i>
        <span class="hidden sm:inline">SPOTIFY</span> VINYL
    </div>
    <div class="flex items-center space-x-2">
        <button id="split-toggle-btn" onclick="toggleSplitLayout()" class="brutal-card bg-yellow-300 hover:bg-yellow-400 px-2.5 sm:px-3 py-1.5 font-bold text-xs uppercase shadow-[3px_3px_0px_#000] hidden lg:flex items-center space-x-1.5">
            <i class="fa-solid fa-columns"></i>
            <span id="split-btn-text">Dividir Tela</span>
        </button>
        <button onclick="toggleFullscreenLyrics(true)" class="brutal-card bg-pink-500 text-white hover:bg-pink-600 px-2.5 sm:px-3 py-1.5 font-bold text-xs uppercase shadow-[3px_3px_0px_#000] flex items-center space-x-1.5">
            <i class="fa-solid fa-expand"></i>
            <span class="hidden sm:inline">Tela Cheia</span>
        </button>
        <button onclick="logout()" class="brutal-card bg-white hover:bg-red-100 text-red-600 px-2.5 sm:px-3 py-1.5 font-bold text-xs uppercase shadow-[3px_3px_0px_#000]">
            Sair
        </button>
    </div>
</div>

<div class="app-container">
    
    <div id="login-screen" class="screen active" style="background-color: var(--pink-neon);">
        <h1>SPOTIFY<br><span style="color: transparent; -webkit-text-stroke: 2px #000;">VINYL</span></h1>
        <p style="color: #000; font-weight: 800;">PLAYER IMERSIVO & LETRAS SINCRONIZADAS</p>
        <div class="input-group">
            <button class="btn" id="login-btn" style="background: var(--yellow-neon);">
                <i class="fa-brands fa-spotify text-lg"></i>
                <span>CONECTAR COM SPOTIFY</span>
            </button>
        </div>
    </div>

    <div id="player-screen" class="screen" style="background-color: #121212;">
        
        <div id="player-layout-container" class="player-wrapper">
            
            <div class="brutal-card bg-white p-4 sm:p-5 w-full flex flex-col items-center space-y-4">
                
                <div class="flex space-x-1.5 bg-gray-100 p-1 border-2 border-black shadow-[2px_2px_0px_#000] text-[11px] sm:text-xs font-bold">
                    <button onclick="setTheme('classic')" class="px-2.5 py-1 bg-pink-500 text-white theme-btn border border-black" data-theme="classic">Clássico</button>
                    <button onclick="setTheme('gold')" class="px-2.5 py-1 hover:bg-gray-200 text-black theme-btn border border-transparent" data-theme="gold">Dourado</button>
                    <button onclick="setTheme('cyber')" class="px-2.5 py-1 hover:bg-gray-200 text-black theme-btn border border-transparent" data-theme="cyber">Cyber</button>
                </div>

                <div class="relative w-56 h-56 sm:w-60 sm:h-60 flex items-center justify-center my-1">
                    <div id="album-sleeve" class="absolute left-0 w-44 h-44 sm:w-48 sm:h-48 bg-white rounded-none shadow-2xl border-3 border-black overflow-hidden transition-all duration-500 transform -translate-x-4 rotate-[-4deg]">
                        <img id="sleeve-img" src="" alt="Capa" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x200/111/fff?text=SPOTIFY'">
                    </div>
                    <div id="vinyl-record" class="absolute right-0 w-48 h-48 sm:w-52 sm:h-52 rounded-full vinyl-grooves shadow-2xl flex items-center justify-center border-3 border-black animate-spin-slow paused transition-all duration-300">
                        <div class="w-16 h-16 sm:w-18 sm:h-18 rounded-full overflow-hidden border-3 border-black relative shadow-inner flex items-center justify-center bg-black">
                            <img id="vinyl-center-img" src="" alt="Selo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/111/fff?text=VINYL'">
                            <div class="absolute w-3.5 h-3.5 bg-white rounded-full border border-black"></div>
                        </div>
                    </div>
                </div>

                <div class="w-full text-center space-y-1 px-1">
                    <h3 id="track-name" class="text-base sm:text-lg font-black truncate text-black uppercase tracking-tight">Nenhuma música tocando</h3>
                    <p id="artist-name" class="text-xs text-gray-700 font-bold truncate uppercase mb-0">Abra o Spotify e dê play</p>
                </div>

                <div class="w-full space-y-1">
                    <div class="flex justify-between text-[11px] font-mono font-bold text-black">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                    <div id="progress-container" class="progress-bar-container" onclick="seekTrack(event)">
                        <div id="progress-bar" class="progress-bar-fill"></div>
                    </div>
                </div>

                <div class="flex items-center space-x-5 pt-1">
                    <button onclick="controlPlayback('previous')" class="brutal-card bg-gray-100 hover:bg-gray-200 p-2.5 flex items-center justify-center transition shadow-[2px_2px_0px_#000]">
                        <i class="fa-solid fa-backward-step text-black text-sm"></i>
                    </button>
                    <button id="play-pause-btn" onclick="togglePlayPause()" class="brutal-card bg-pink-500 hover:bg-pink-600 text-white w-12 h-12 flex items-center justify-center transition shadow-[3px_3px_0px_#000] transform hover:scale-105">
                        <i id="play-icon" class="fa-solid fa-play text-lg ml-0.5"></i>
                        <i id="pause-icon" class="fa-solid fa-pause text-lg hidden"></i>
                    </button>
                    <button onclick="controlPlayback('next')" class="brutal-card bg-gray-100 hover:bg-gray-200 p-2.5 flex items-center justify-center transition shadow-[2px_2px_0px_#000]">
                        <i class="fa-solid fa-forward-step text-black text-sm"></i>
                    </button>
                </div>

            </div>

            <div id="split-lyrics-pane" class="lyrics-pane p-4 flex flex-col">
                <div class="flex justify-between items-center pb-2 border-b-2 border-gray-800 mb-2">
                    <span class="text-[11px] font-black text-pink-500 tracking-wider uppercase font-mono">Letra Sincronizada</span>
                    <div class="flex space-x-1 bg-black p-0.5 border border-gray-700 text-[10px] font-bold text-white">
                        <button onclick="setLyricsMode('karaoke')" class="px-2 py-0.5 bg-pink-500 text-white lyric-mode-btn" data-mode="karaoke">Karaokê</button>
                        <button onclick="setLyricsMode('poetry')" class="px-2 py-0.5 hover:bg-gray-800 lyric-mode-btn" data-mode="poetry">Poema</button>
                        <button onclick="setLyricsMode('minimal')" class="px-2 py-0.5 hover:bg-gray-800 lyric-mode-btn" data-mode="minimal">Minimal</button>
                    </div>
                </div>
                <div id="split-lyrics-box" class="flex-1 overflow-y-auto py-20 text-center relative scroll-smooth">
                    <div id="split-lyrics-content" class="text-gray-400 font-bold text-xs">Aguardando música...</div>
                </div>
            </div>

        </div>

    </div>
</div>

<div id="fullscreen-lyrics-modal" class="p-4 sm:p-6 flex flex-col">
    <div class="w-full flex justify-between items-center pb-3 border-b-3 border-white bg-black">
        <div class="flex flex-col truncate pr-3">
            <span id="fs-track-title" class="font-black text-lg text-yellow-300 uppercase truncate">Música</span>
            <span id="fs-artist-title" class="text-xs text-gray-400 font-bold uppercase truncate">Artista</span>
        </div>
        <div class="flex items-center space-x-2">
            <div class="hidden sm:flex space-x-1 bg-zinc-900 p-1 border border-white text-xs font-bold text-white">

                <button onclick="setLyricsMode('poetry')" class="px-2.5 py-1 hover:bg-zinc-800 lyric-mode-btn" data-mode="poetry">Poema</button>
                <button onclick="setLyricsMode('minimal')" class="px-2.5 py-1 hover:bg-zinc-800 lyric-mode-btn" data-mode="minimal">Minimal</button>
            </div>
            <button onclick="toggleFullscreenLyrics(false)" class="brutal-card bg-yellow-300 hover:bg-yellow-400 text-black px-3 py-1.5 font-black uppercase text-xs shadow-[2px_2px_0px_#fff]">
                <i class="fa-solid fa-xmark mr-1"></i> Fechar

        </div>
    </div>

    <div id="fs-lyrics-box" class="flex-1 overflow-y-auto py-32 sm:py-40 px-4 text-center relative scroll-smooth flex flex-col items-center">
        <div id="fs-lyrics-content" class="w-full max-w-xl text-gray-400 font-bold text-sm sm:text-base">Carregando letra...</div>
    </div>
</div>

<div class="island-container">
    <div class="island" id="dynamic-island">
        <i id="island-mini-icon" class="fa-solid fa-spotify"></i>
        <div class="island-mini-status">
            <div class="dot" id="status-dot"></div>
            <span id="mini-player-count">SPOTIFY</span>
        </div>
        <div class="island-content">
            <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                <div id="island-icon-bg" style="width: 32px; height: 32px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--pink-neon); flex-shrink: 0;">
                    <i id="island-icon" class="fa-solid fa-music text-xs" style="color: var(--yellow-neon);"></i>
                </div>
                <div class="island-info-text">
                    <span class="island-label" id="island-label">PLAYER</span>
                    <span class="island-main" id="island-main">AGUARDANDO...</span>
                </div>
            </div>
            <div id="island-action-icon" style="flex-shrink: 0; margin-left: 6px;">
                <i class="fa-solid fa-bolt-lightning text-xs" style="color: var(--green-neon); filter: drop-shadow(0 0 5px var(--green-neon));"></i>
            </div>
        </div>
    </div>
</div>

<script>
    const clientId = 'c17b8a32ee1249ef976034607a115409';
    const isCordova = window.location.protocol === 'file:';
    const redirectUri = isCordova ? 'meuspitchapp://callback' : window.location.origin + window.location.pathname;
    const scopes = 'user-read-playback-state user-read-currently-playing user-modify-playback-state';

    let accessToken = localStorage.getItem('spotify_access_token');
    let refreshToken = localStorage.getItem('spotify_refresh_token');
    let tokenExpiry = localStorage.getItem('spotify_token_expiry');
    let isPlayingState = false;
    let progressInterval = null;
    let trackDuration = 0;
    let trackProgress = 0;
    let currentTrackId = null;
    let lyricsData = null;
    let currentLyricsMode = 'karaoke';
    let isSplitLayoutActive = false;

    const islandEl = document.getElementById('dynamic-island');
    const islandMiniIcon = document.getElementById('island-mini-icon');
    const dotEl = document.getElementById('status-dot');
    const islandLabel = document.getElementById('island-label');
    const islandMain = document.getElementById('island-main');
    const islandIcon = document.getElementById('island-icon');
    const miniPlayerCount = document.getElementById('mini-player-count');

    if (islandEl) {
        islandEl.onclick = () => { islandEl.classList.toggle('active'); };
    }

    function notifyIsland(label, main, iconClass = "fa-music", type = "default", duration = 3000) {
        if (!islandLabel || !islandMain || !islandEl || !dotEl) return;
        islandLabel.innerText = label;
        islandMain.innerText = main;
        const fullIconClass = `fa-solid ${iconClass}`;
        if (islandIcon) islandIcon.className = fullIconClass;
        if (islandMiniIcon) islandMiniIcon.className = fullIconClass;
        
        islandEl.classList.remove('pulse', 'error', 'mini-active');
        void islandEl.offsetWidth; 
        if(type !== 'default') islandEl.classList.add(type);
        islandEl.classList.add('active', 'pulse');
        dotEl.classList.add('online');

        setTimeout(() => {
            islandEl.classList.remove('active', 'pulse');
            islandEl.classList.add('mini-active');
        }, duration);
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        let code = params.get('code');

        if (!code && window.location.href.includes('code=')) {
            try {
                const urlParams = new URLSearchParams(window.location.href.split('?')[1]);
                code = urlParams.get('code');
            } catch (e) {}
        }

        if (code) {
            if (!isCordova) {
                window.history.replaceState({}, document.title, redirectUri);
            }
            await exchangeCodeForToken(code);
        } else if (accessToken) {
            if (tokenExpiry && Date.now() > parseInt(tokenExpiry)) {
                await refreshAccessToken();
            } else {
                showPlayer();
            }
        } else {
            showLogin();
        }

        document.getElementById('login-btn').addEventListener('click', redirectToSpotifyLogin);
    });

    async function redirectToSpotifyLogin() {
        const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        const randomString = (length) => Array.from(crypto.getRandomValues(new Uint8Array(length))).map(x => possible[x % possible.length]).join('');
        
        const codeVerifier = randomString(64);
        const data = new TextEncoder().encode(codeVerifier);
        const digest = await crypto.subtle.digest('SHA-256', data);
        const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
            .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

        localStorage.setItem('spotify_code_verifier', codeVerifier);

        const authUrl = new URL('https://accounts.spotify.com/authorize');
        authUrl.searchParams.append('client_id', clientId);
        authUrl.searchParams.append('response_type', 'code');
        authUrl.searchParams.append('redirect_uri', redirectUri);
        authUrl.searchParams.append('code_challenge_method', 'S256');
        authUrl.searchParams.append('code_challenge', codeChallenge);
        authUrl.searchParams.append('scope', scopes);

        window.location.href = authUrl.toString();
    }

    async function exchangeCodeForToken(code) {
        const codeVerifier = localStorage.getItem('spotify_code_verifier');
        if (!codeVerifier) { showLogin(); return; }

        try {
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: redirectUri,
                    code_verifier: codeVerifier,
                }),
            });
            const data = await response.json();
            if (data.access_token) {
                saveTokens(data);
                showPlayer();
                notifyIsland("SPOTIFY", "CONECTADO COM SUCESSO", "fa-check", "default");
            } else { showLogin(); }
        } catch (err) { showLogin(); }
    }

    async function refreshAccessToken() {
        if (!refreshToken) { showLogin(); return; }
        try {
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'refresh_token',
                    refresh_token: refreshToken,
                }),
            });
            const data = await response.json();
            if (data.access_token) { saveTokens(data); } else { showLogin(); }
        } catch (err) { showLogin(); }
    }

    function saveTokens(data) {
        accessToken = data.access_token;
        localStorage.setItem('spotify_access_token', accessToken);
        if (data.refresh_token) {
            refreshToken = data.refresh_token;
            localStorage.setItem('spotify_refresh_token', refreshToken);
        }
        if (data.expires_in) {
            const expiryTime = Date.now() + (data.expires_in * 1000);
            tokenExpiry = expiryTime;
            localStorage.setItem('spotify_token_expiry', expiryTime);
        }
    }

    function showLogin() {
        document.getElementById('login-screen').classList.add('active');
        document.getElementById('player-screen').classList.remove('active');
        document.getElementById('top-toolbar').style.display = 'none';
        if (miniPlayerCount) miniPlayerCount.innerText = "OFFLINE";
    }

    function showPlayer() {
        document.getElementById('login-screen').classList.remove('active');
        document.getElementById('player-screen').classList.add('active');
        document.getElementById('top-toolbar').style.display = 'flex';
        if (miniPlayerCount) miniPlayerCount.innerText = "ONLINE";
        
        fetchCurrentPlayback();
        setInterval(fetchCurrentPlayback, 3000);
    }

    function logout() {
        localStorage.clear();
        window.location.href = isCordova ? 'index.html' : redirectUri;
    }

    async function fetchCurrentPlayback() {
        if (!accessToken) return;

        try {
            const response = await fetch('https://api.spotify.com/v1/me/player', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });

            if (response.status === 401) {
                await refreshAccessToken();
                return;
            }

            if (response.status === 204 || response.status > 400) {
                setIdleState();
                return;
            }

            const data = await response.json();
            updatePlayerUI(data);
        } catch (err) {
            console.error('Erro ao buscar player:', err);
        }
    }

    function setIdleState() {
        document.getElementById('track-name').innerText = 'Nenhuma música tocando';
        document.getElementById('artist-name').innerText = 'Abra o Spotify e dê play';
        document.getElementById('vinyl-record').classList.add('paused');
        document.getElementById('sleeve-img').src = '';
        document.getElementById('vinyl-center-img').src = '';
        
        const idleHTML = '<span class="text-gray-500 font-bold text-xs">Nenhuma música reproduzindo no momento.</span>';
        document.getElementById('split-lyrics-content').innerHTML = idleHTML;
        document.getElementById('fs-lyrics-content').innerHTML = idleHTML;

        isPlayingState = false;
        currentTrackId = null;
        updatePlayPauseIcon(false);
        clearInterval(progressInterval);
    }

    async function updatePlayerUI(data) {
        if (!data || !data.item) {
            setIdleState();
            return;
        }

        const track = data.item;
        const isPlaying = data.is_playing;
        isPlayingState = isPlaying;

        if (currentTrackId !== track.id) {
            currentTrackId = track.id;
            await fetchLyrics(track.name, track.artists[0].name, track.album.name, Math.floor(track.duration_ms / 1000));
        }

        const trackNameStr = track.name;
        const artistNameStr = track.artists.map(a => a.name).join(', ');

        document.getElementById('track-name').innerText = trackNameStr;
        document.getElementById('artist-name').innerText = artistNameStr;
        document.getElementById('fs-track-title').innerText = trackNameStr;
        document.getElementById('fs-artist-title').innerText = artistNameStr;
        if (islandMain) islandMain.innerText = trackNameStr;

        const albumImg = track.album.images[0]?.url || '';
        if (document.getElementById('sleeve-img').src !== albumImg) {
            document.getElementById('sleeve-img').src = albumImg;
            document.getElementById('vinyl-center-img').src = albumImg;
        }

        const vinyl = document.getElementById('vinyl-record');
        if (isPlaying) vinyl.classList.remove('paused');
        else vinyl.classList.add('paused');

        updatePlayPauseIcon(isPlaying);

        trackDuration = track.duration_ms;
        trackProgress = data.progress_ms;
        updateProgressUI();

        if (isPlaying) {
            startProgressTicker();
        } else {
            clearInterval(progressInterval);
        }

        highlightCurrentLyric(trackProgress);
    }

    async function fetchLyrics(trackName, artistName, albumName, duration) {
        const loadingHTML = '<span class="text-yellow-400 animate-pulse font-bold text-xs">Buscando letra sincronizada...</span>';
        document.getElementById('split-lyrics-content').innerHTML = loadingHTML;
        document.getElementById('fs-lyrics-content').innerHTML = loadingHTML;
        lyricsData = null;

        try {
            const url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artistName)}&track_name=${encodeURIComponent(trackName)}&album_name=${encodeURIComponent(albumName)}&duration=${duration}`;
            const response = await fetch(url);
            
            if (!response.ok) {
                const errHTML = '<span class="text-gray-400 font-bold text-xs">Letra não encontrada para esta faixa.</span>';
                document.getElementById('split-lyrics-content').innerHTML = errHTML;
                document.getElementById('fs-lyrics-content').innerHTML = errHTML;
                return;
            }

            const data = await response.json();
            
            if (data.syncedLyrics) {
                lyricsData = parseLrc(data.syncedLyrics);
                renderLyricsHTML();
            } else if (data.plainLyrics) {
                lyricsData = data.plainLyrics.split('\n').map((text, idx) => ({ time: idx * 3000, text }));
                renderLyricsHTML();
            } else {
                const instHTML = '<span class="text-gray-400 font-bold text-xs">Letra instrumental ou indisponível.</span>';
                document.getElementById('split-lyrics-content').innerHTML = instHTML;
                document.getElementById('fs-lyrics-content').innerHTML = instHTML;
            }
        } catch (err) {
            const errHTML = '<span class="text-gray-400 font-bold text-xs">Erro ao carregar a letra.</span>';
            document.getElementById('split-lyrics-content').innerHTML = errHTML;
            document.getElementById('fs-lyrics-content').innerHTML = errHTML;
        }
    }

    function parseLrc(lrcString) {
        const lines = lrcString.split('\n');
        const parsed = [];
        const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

        for (let line of lines) {
            const match = timeReg.exec(line);
            if (match) {
                const mins = parseInt(match[1], 10);
                const secs = parseInt(match[2], 10);
                const ms = parseInt(match[3].padEnd(3, '0'), 10);
                const totalMs = (mins * 60 + secs) * 1000 + ms;
                const text = line.replace(timeReg, '').trim();
                parsed.push({ time: totalMs, text: text });
            }
        }
        return parsed;
    }

    function renderLyricsHTML() {
        if (!lyricsData || lyricsData.length === 0) return;

        let html = '<div class="space-y-4 py-4">';
        lyricsData.forEach((item, index) => {
            html += `<p id="lyric-line-${index}" class="lyric-item transition-all duration-300 text-gray-500 text-xs sm:text-sm font-bold leading-relaxed">${item.text || '&bull;&bull;&bull;'}</p>`;
        });
        html += '</div>';

        document.getElementById('split-lyrics-content').innerHTML = html;
        document.getElementById('fs-lyrics-content').innerHTML = html;
    }

    function highlightCurrentLyric(currentTimeMs) {
        if (!lyricsData || lyricsData.length === 0) return;

        let activeIndex = -1;
        for (let i = 0; i < lyricsData.length; i++) {
            if (currentTimeMs >= lyricsData[i].time) {
                activeIndex = i;
            } else {
                break;
            }
        }

        for (let i = 0; i < lyricsData.length; i++) {
            const splitLine = document.getElementById(`split-lyrics-content`)?.querySelector(`#lyric-line-${i}`);
            const fsLine = document.getElementById(`fs-lyrics-content`)?.querySelector(`#lyric-line-${i}`);

            const elements = [splitLine, fsLine].filter(Boolean);
            elements.forEach(lineEl => {
                if (currentLyricsMode === 'minimal') {
                    if (i === activeIndex) {
                        lineEl.className = 'lyric-item transition-all duration-300 text-yellow-300 font-black text-lg sm:text-2xl scale-105 my-6 uppercase';
                        lineEl.style.display = 'block';
                    } else {
                        lineEl.style.display = 'none';
                    }
                } else if (currentLyricsMode === 'poetry') {
                    lineEl.style.display = 'block';
                    if (i === activeIndex) {
                        lineEl.className = 'lyric-item transition-all duration-300 text-pink-500 font-bold text-xs sm:text-sm my-2 scale-102 uppercase';
                    } else {
                        lineEl.className = 'lyric-item transition-all duration-300 text-gray-600 text-xs my-2';
                    }
                } else {
                    lineEl.style.display = 'block';
                    if (i === activeIndex) {
                        lineEl.className = 'lyric-item transition-all duration-300 text-yellow-300 font-black text-sm sm:text-base my-3 scale-105 uppercase';
                    } else if (Math.abs(i - activeIndex) === 1) {
                        lineEl.className = 'lyric-item transition-all duration-300 text-gray-300 text-xs sm:text-sm font-bold my-2';
                    } else {
                        lineEl.className = 'lyric-item transition-all duration-300 text-gray-600 text-xs font-bold my-2 opacity-50';
                    }
                }
            });
        }

        if (activeIndex !== -1) {
            const activeSplit = document.getElementById(`split-lyrics-content`)?.querySelector(`#lyric-line-${activeIndex}`);
            const activeFs = document.getElementById(`fs-lyrics-content`)?.querySelector(`#lyric-line-${activeIndex}`);

            if (activeSplit && isSplitLayoutActive) {
                const box = document.getElementById('split-lyrics-box');
                box.scrollTo({ top: activeSplit.offsetTop - box.clientHeight / 2 + activeSplit.clientHeight / 2, behavior: 'smooth' });
            }
            if (activeFs) {
                const boxFs = document.getElementById('fs-lyrics-box');
                boxFs.scrollTo({ top: activeFs.offsetTop - boxFs.clientHeight / 2 + activeFs.clientHeight / 2, behavior: 'smooth' });
            }
        }
    }

    function setLyricsMode(mode) {
        currentLyricsMode = mode;
        document.querySelectorAll('.lyric-mode-btn').forEach(btn => {
            if (btn.dataset.mode === mode) {
                btn.classList.add('bg-pink-500', 'text-white');
                btn.classList.remove('hover:bg-zinc-800', 'hover:bg-gray-800');
            } else {
                btn.classList.remove('bg-pink-500', 'text-white');
                btn.classList.add('hover:bg-zinc-800', 'hover:bg-gray-800');
            }
        });
        highlightCurrentLyric(trackProgress);
    }

    function toggleSplitLayout() {
        isSplitLayoutActive = !isSplitLayoutActive;
        const container = document.getElementById('player-layout-container');
        const splitPane = document.getElementById('split-lyrics-pane');
        const btnText = document.getElementById('split-btn-text');

        if (isSplitLayoutActive) {
            container.classList.add('split-active');
            splitPane.classList.add('active-split');
            btnText.innerText = 'Ocultar Divisão';
            setTimeout(() => highlightCurrentLyric(trackProgress), 100);
        } else {
            container.classList.remove('split-active');
            splitPane.classList.remove('active-split');
            btnText.innerText = 'Dividir Tela';
        }
    }

    function toggleFullscreenLyrics(open) {
        const modal = document.getElementById('fullscreen-lyrics-modal');
        if (open) {
            modal.classList.add('show');
            setTimeout(() => highlightCurrentLyric(trackProgress), 100);
        } else {
            modal.classList.remove('show');
        }
    }

    function updatePlayPauseIcon(isPlaying) {
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        if (isPlaying) {
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
        } else {
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
        }
    }

    function startProgressTicker() {
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (isPlayingState) {
                trackProgress += 1000;
                if (trackProgress > trackDuration) trackProgress = trackDuration;
                updateProgressUI();
                highlightCurrentLyric(trackProgress);
            }
        }, 1000);
    }

    function updateProgressUI() {
        const currentSecs = Math.floor(trackProgress / 1000);
        const totalSecs = Math.floor(trackDuration / 1000);

        document.getElementById('current-time').innerText = formatTime(currentSecs);
        document.getElementById('total-time').innerText = formatTime(totalSecs);

        const percentage = trackDuration > 0 ? (trackProgress / trackDuration) * 100 : 0;
        document.getElementById('progress-bar').style.width = `${percentage}%`;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function getActiveDeviceId() {
        try {
            const response = await fetch('https://api.spotify.com/v1/me/player/devices', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (response.ok) {
                const data = await response.json();
                const activeDevice = data.devices.find(d => d.is_active) || data.devices[0];
                return activeDevice ? activeDevice.id : null;
            }
        } catch (err) {}
        return null;
    }

    async function togglePlayPause() {
        const endpoint = isPlayingState ? 'pause' : 'play';
        const deviceId = await getActiveDeviceId();
        let url = `https://api.spotify.com/v1/me/player/${endpoint}`;
        if (deviceId && endpoint === 'play') url += `?device_id=${deviceId}`;

        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (response.status === 401) { await refreshAccessToken(); return; }
            setTimeout(fetchCurrentPlayback, 400);
        } catch (err) {}
    }

    async function controlPlayback(action) {
        const deviceId = await getActiveDeviceId();
        let url = `https://api.spotify.com/v1/me/player/${action}`;
        if (deviceId) url += `?device_id=${deviceId}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (response.status === 401) { await refreshAccessToken(); return; }
            setTimeout(fetchCurrentPlayback, 500);
        } catch (err) {}
    }

    async function seekTrack(event) {
        const container = document.getElementById('progress-container');
        const rect = container.getBoundingClientRect();
        const seekPos = Math.floor(trackDuration * ((event.clientX - rect.left) / rect.width));

        const deviceId = await getActiveDeviceId();
        let url = `https://api.spotify.com/v1/me/player/seek?position_ms=${seekPos}`;
        if (deviceId) url += `&device_id=${deviceId}`;

        try {
            const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (response.ok) {
                trackProgress = seekPos;
                updateProgressUI();
                highlightCurrentLyric(trackProgress);
            }
        } catch (err) {}
    }

    function setTheme(theme) {
        const vinyl = document.getElementById('vinyl-record');
        vinyl.classList.remove('vinyl-grooves', 'vinyl-gold', 'vinyl-cyber');
        if (theme === 'classic') vinyl.classList.add('vinyl-grooves');
        if (theme === 'gold') vinyl.classList.add('vinyl-gold');
        if (theme === 'cyber') vinyl.classList.add('vinyl-cyber');

        document.querySelectorAll('.theme-btn').forEach(btn => {
            if (btn.dataset.theme === theme) {
                btn.classList.add('bg-pink-500', 'text-white', 'border-black');
                btn.classList.remove('hover:bg-gray-200', 'border-transparent');
            } else {
                btn.classList.remove('bg-pink-500', 'text-white', 'border-black');
                btn.classList.add('hover:bg-gray-200', 'border-transparent');
            }
        });
    }
</script>
