<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Vinyl & Immersive Lyrics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        spotify: '#1DB954',
                        spotifyDark: '#121212',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 20s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }
        /* Ranhuras do Vinil */
        .vinyl-grooves {
            background: repeating-radial-gradient(
                circle at center,
                #111 0px,
                #111 2px,
                #222 3px,
                #111 4px
            );
        }
        .vinyl-gold {
            background: repeating-radial-gradient(
                circle at center,
                #2a2200 0px,
                #2a2200 2px,
                #daa520 3px,
                #1a1400 4px
            );
        }
        .vinyl-cyber {
            background: repeating-radial-gradient(
                circle at center,
                #0b0f19 0px,
                #0b0f19 2px,
                #00f0ff 3px,
                #110022 4px
            );
        }
        /* Scrollbars customizadas */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(29, 185, 84, 0.6);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-black text-white min-h-screen flex flex-col items-center justify-between p-4 selection:bg-spotify selection:text-black">

    <!-- Cabeçalho -->
    <header class="w-full max-w-5xl flex justify-between items-center py-4 px-4">
        <div class="flex items-center space-x-2">
            <svg class="w-8 h-8 text-spotify" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.599-.12-.421.18-.78.6-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.54.66.24 1.08zm1.44-3.9c-.301.42-.841.6-1.261.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.02.6-1.14 4.2-1.26 9.6-0.6 13.38 1.68.48.3.6.9.36 1.38zm.12-4.08C13.92 7.08 8.1 6.9 4.8 7.92c-.6.18-1.2-.18-1.38-.78-.18-.6.18-1.2.78-1.38 3.84-1.2 10.38-0.96 14.7 1.62.54.36.72 1.08.36 1.62-.36.54-1.08.72-1.62.36z"/>
            </svg>
            <span class="font-bold text-lg tracking-wider">VinylPlayer</span>
        </div>
        
        <!-- Controles do Header -->
        <div class="flex items-center space-x-3">
            <!-- Botão de Alternar Divisão de Tela (Lado a Lado) -->
            <button id="split-toggle-btn" onclick="toggleSplitLayout()" class="hidden text-xs bg-gray-800/80 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-xl transition border border-gray-700/50 flex items-center space-x-1.5" title="Dividir tela com letras">
                <svg class="w-4 h-4 text-spotify" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4m10-16h4a2 2 0 012 2v12a2 2 0 01-2 2h-4m-10 0V4m10 0v16"></path></svg>
                <span id="split-btn-text">Dividir Tela</span>
            </button>

            <!-- Botão de Letras em Tela Cheia -->
            <button id="fullscreen-lyrics-trigger" onclick="toggleFullscreenLyricsModal(true)" class="hidden p-2 rounded-xl bg-gray-800/80 hover:bg-gray-700 text-spotify transition shadow-md flex items-center justify-center" title="Abrir Letras em Tela Cheia">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            </button>

            <div id="auth-container"></div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="w-full max-w-5xl flex flex-col items-center justify-center my-auto space-y-6">
        
        <!-- Estado Desconectado -->
        <div id="login-screen" class="text-center py-14 px-8 bg-gray-900/60 backdrop-blur-md rounded-2xl border border-gray-800 shadow-2xl max-w-md w-full">
            <div class="w-20 h-20 bg-spotify/10 rounded-full flex items-center justify-center mx-auto mb-6 text-spotify">
                <svg class="w-10 h-10 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
            </div>
            <h2 class="text-2xl font-bold mb-2">Conecte sua conta</h2>
            <p class="text-gray-400 text-sm mb-6">Experimente o vinil interativo e as opções avançadas de letras sincronizadas.</p>
            <button id="login-btn" class="w-full bg-spotify hover:bg-spotify/90 text-black font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-spotify/20 flex items-center justify-center space-x-2">
                <span>Conectar com o Spotify</span>
            </button>
        </div>

        <!-- Estado Conectado / Player -->
        <div id="player-screen" class="w-full flex flex-col items-center justify-center hidden py-4">
            
            <!-- Contêiner Dinâmico (Muda de Centralizado para Lado a Lado conforme o botão) -->
            <div id="player-layout-container" class="flex flex-col items-center justify-center w-full max-w-md transition-all duration-300">
                
                <!-- Player & Vinil -->
                <div class="flex flex-col items-center space-y-6 w-full max-w-md bg-gray-900/40 p-6 rounded-3xl border border-gray-800/80 shadow-2xl backdrop-blur-md">
                    
                    <!-- Seletores de Tema do Vinil -->
                    <div class="flex space-x-2 bg-gray-900/80 p-1 rounded-xl border border-gray-800 text-xs">
                        <button onclick="setTheme('classic')" class="px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 transition theme-btn" data-theme="classic">Clássico</button>
                        <button onclick="setTheme('gold')" class="px-3 py-1.5 rounded-lg hover:bg-gray-700 transition theme-btn" data-theme="gold">Dourado</button>
                        <button onclick="setTheme('cyber')" class="px-3 py-1.5 rounded-lg hover:bg-gray-700 transition theme-btn" data-theme="cyber">Cyberpunk</button>
                    </div>

                    <!-- Palco do Vinil -->
                    <div class="relative w-64 h-64 flex items-center justify-center my-2">
                        <div id="album-sleeve" class="absolute left-0 w-52 h-52 bg-gray-800 rounded-lg shadow-2xl overflow-hidden transition-all duration-500 transform -translate-x-5 rotate-[-4deg]">
                            <img id="sleeve-img" src="" alt="Capa" class="w-full h-full object-cover opacity-80">
                        </div>
                        <div id="vinyl-record" class="absolute right-0 w-56 h-56 rounded-full vinyl-grooves shadow-2xl flex items-center justify-center border-4 border-gray-900 animate-spin-slow paused transition-all duration-300">
                            <div class="w-20 h-20 rounded-full overflow-hidden border-4 border-gray-800 relative shadow-inner flex items-center justify-center">
                                <img id="vinyl-center-img" src="" alt="Selo" class="w-full h-full object-cover">
                                <div class="absolute w-3.5 h-3.5 bg-gray-950 rounded-full border border-gray-700"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Informações da Música -->
                    <div class="w-full text-center space-y-1 px-2">
                        <h3 id="track-name" class="text-lg font-bold truncate text-white">Nenhuma música tocando</h3>
                        <p id="artist-name" class="text-sm text-gray-400 truncate">Abra o Spotify e dê play</p>
                    </div>

                    <!-- Barra de Progresso -->
                    <div class="w-full space-y-1 px-2">
                        <div class="flex justify-between text-xs text-gray-400 font-mono">
                            <span id="current-time">0:00</span>
                            <span id="total-time">0:00</span>
                        </div>
                        <div id="progress-container" class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden cursor-pointer relative" onclick="seekTrack(event)">
                            <div id="progress-bar" class="h-full bg-spotify w-0 transition-all duration-100"></div>
                        </div>
                    </div>

                    <!-- Controles de Mídia -->
                    <div class="flex items-center space-x-6">
                        <button onclick="controlPlayback('previous')" class="text-gray-400 hover:text-white transition transform hover:scale-110">
                            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button id="play-pause-btn" onclick="togglePlayPause()" class="w-14 h-14 bg-spotify hover:bg-spotify/90 text-black rounded-full flex items-center justify-center transition transform hover:scale-105 shadow-lg shadow-spotify/20">
                            <svg id="play-icon" class="w-7 h-7 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="pause-icon" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        <button onclick="controlPlayback('next')" class="text-gray-400 hover:text-white transition transform hover:scale-110">
                            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>

                </div>

                <!-- Painel Lateral de Letras (Aparece apenas quando o Split Mode estiver ativo) -->
                <div id="split-lyrics-pane" class="hidden flex-col w-full max-w-md h-[460px] bg-gray-900/50 backdrop-blur-xl border border-gray-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
                    <div class="flex justify-between items-center pb-3 border-b border-gray-800">
                        <span class="text-xs font-bold text-spotify tracking-wider uppercase">Letra Sincronizada</span>
                        <div class="flex space-x-1 bg-black/40 p-1 rounded-xl border border-gray-800 text-xs">
                            <button onclick="setLyricsMode('karaoke')" class="px-2.5 py-1 rounded-lg bg-gray-800 transition lyric-mode-btn" data-mode="karaoke">Karaokê</button>
                            <button onclick="setLyricsMode('poetry')" class="px-2.5 py-1 rounded-lg hover:bg-gray-800 transition lyric-mode-btn" data-mode="poetry">Poema</button>
                            <button onclick="setLyricsMode('minimal')" class="px-2.5 py-1 rounded-lg hover:bg-gray-800 transition lyric-mode-btn" data-mode="minimal">Minimal</button>
                        </div>
                    </div>
                    <div id="split-lyrics-box" class="flex-1 overflow-y-auto py-32 text-center relative scroll-smooth">
                        <div id="split-lyrics-content" class="text-gray-500 font-medium">Aguardando música...</div>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <!-- MODAL DE LETRAS EM TELA CHEIA -->
    <div id="fullscreen-lyrics-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl flex flex-col hidden transition-opacity duration-300">
        <div class="w-full flex justify-between items-center p-6 border-b border-gray-800/80">
            <div class="flex items-center space-x-3">
                <span id="fs-track-title" class="font-bold text-lg text-white truncate max-w-xs">Música</span>
                <span class="text-gray-500">•</span>
                <span id="fs-artist-title" class="text-sm text-gray-400 truncate max-w-xs">Artista</span>
            </div>

            <div class="flex items-center space-x-4">
                <div class="hidden sm:flex space-x-1 bg-gray-900 p-1 rounded-xl border border-gray-800 text-xs">
                    <button onclick="setLyricsMode('karaoke')" class="px-3 py-1.5 rounded-lg bg-gray-800 transition lyric-mode-btn" data-mode="karaoke">Karaokê</button>
                    <button onclick="setLyricsMode('poetry')" class="px-3 py-1.5 rounded-lg hover:bg-gray-800 transition lyric-mode-btn" data-mode="poetry">Poema</button>
                    <button onclick="setLyricsMode('minimal')" class="px-3 py-1.5 rounded-lg hover:bg-gray-800 transition lyric-mode-btn" data-mode="minimal">Minimal</button>
                </div>
                <button onclick="toggleFullscreenLyricsModal(false)" class="p-2.5 bg-gray-800 hover:bg-gray-700 text-white rounded-full transition shadow-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <div id="fs-lyrics-box" class="flex-1 overflow-y-auto py-64 px-4 text-center relative scroll-smooth flex flex-col items-center">
            <div id="fs-lyrics-content" class="w-full max-w-2xl text-gray-500 font-medium">Carregando letra...</div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="w-full max-w-5xl text-center py-4 text-xs text-gray-500">
        Spotify Vinyl & LRCLIB Dynamic Integration
    </footer>

    <!-- Lógica JavaScript -->
    <script>
        const clientId = 'c17b8a32ee1249ef976034607a115409';
        const redirectUri = window.location.origin + window.location.pathname;
        const scopes = 'user-read-playback-state user-read-currently-playing user-modify-playback-state';

        let accessToken = localStorage.getItem('spotify_access_token');
        let refreshToken = localStorage.getItem('spotify_refresh_token');
        let tokenExpiry = localStorage.getItem('spotify_token_expiry');
        let isPlayingState = false;
        let progressInterval = null;
        let trackDuration = 0;
        let trackProgress = 0;
        let currentTrackId = null;
        let lyricsData = null;
        let currentLyricsMode = 'karaoke';
        let isSplitLayoutActive = false;

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');

            if (code) {
                window.history.replaceState({}, document.title, redirectUri);
                await exchangeCodeForToken(code);
            } else if (accessToken) {
                if (tokenExpiry && Date.now() > parseInt(tokenExpiry)) {
                    await refreshAccessToken();
                } else {
                    showPlayer();
                }
            } else {
                showLogin();
            }

            document.getElementById('login-btn').addEventListener('click', redirectToSpotifyLogin);
        });

        async function redirectToSpotifyLogin() {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const randomString = (length) => Array.from(crypto.getRandomValues(new Uint8Array(length))).map(x => possible[x % possible.length]).join('');
            
            const codeVerifier = randomString(64);
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

            localStorage.setItem('spotify_code_verifier', codeVerifier);

            const authUrl = new URL('https://accounts.spotify.com/authorize');
            authUrl.searchParams.append('client_id', clientId);
            authUrl.searchParams.append('response_type', 'code');
            authUrl.searchParams.append('redirect_uri', redirectUri);
            authUrl.searchParams.append('code_challenge_method', 'S256');
            authUrl.searchParams.append('code_challenge', codeChallenge);
            authUrl.searchParams.append('scope', scopes);

            window.location.href = authUrl.toString();
        }

        async function exchangeCodeForToken(code) {
            const codeVerifier = localStorage.getItem('spotify_code_verifier');
            if (!codeVerifier) { showLogin(); return; }

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: redirectUri,
                        code_verifier: codeVerifier,
                    }),
                });
                const data = await response.json();
                if (data.access_token) {
                    saveTokens(data);
                    showPlayer();
                } else { showLogin(); }
            } catch (err) { showLogin(); }
        }

        async function refreshAccessToken() {
            if (!refreshToken) { showLogin(); return; }
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'refresh_token',
                        refresh_token: refreshToken,
                    }),
                });
                const data = await response.json();
                if (data.access_token) { saveTokens(data); } else { showLogin(); }
            } catch (err) { showLogin(); }
        }

        function saveTokens(data) {
            accessToken = data.access_token;
            localStorage.setItem('spotify_access_token', accessToken);
            if (data.refresh_token) {
                refreshToken = data.refresh_token;
                localStorage.setItem('spotify_refresh_token', refreshToken);
            }
            if (data.expires_in) {
                const expiryTime = Date.now() + (data.expires_in * 1000);
                tokenExpiry = expiryTime;
                localStorage.setItem('spotify_token_expiry', expiryTime);
            }
        }

        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('player-screen').classList.add('hidden');
            document.getElementById('fullscreen-lyrics-trigger').classList.add('hidden');
            document.getElementById('split-toggle-btn').classList.add('hidden');
        }

        function showPlayer() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('player-screen').classList.remove('hidden');
            document.getElementById('fullscreen-lyrics-trigger').classList.remove('hidden');
            document.getElementById('split-toggle-btn').classList.remove('hidden');
            
            document.getElementById('auth-container').innerHTML = `
                <button onclick="logout()" class="text-xs text-gray-400 hover:text-white bg-gray-800/80 hover:bg-gray-700 px-3 py-1.5 rounded-lg transition">Sair</button>
            `;
            fetchCurrentPlayback();
            setInterval(fetchCurrentPlayback, 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = redirectUri;
        }

        async function fetchCurrentPlayback() {
            if (!accessToken) return;

            try {
                const response = await fetch('https://api.spotify.com/v1/me/player', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.status === 401) {
                    await refreshAccessToken();
                    return;
                }

                if (response.status === 204 || response.status > 400) {
                    setIdleState();
                    return;
                }

                const data = await response.json();
                updatePlayerUI(data);
            } catch (err) {
                console.error('Erro ao buscar player:', err);
            }
        }

        function setIdleState() {
            document.getElementById('track-name').innerText = 'Nenhuma música tocando';
            document.getElementById('artist-name').innerText = 'Abra o Spotify e dê play';
            document.getElementById('vinyl-record').classList.add('paused');
            document.getElementById('sleeve-img').src = '';
            document.getElementById('vinyl-center-img').src = '';
            
            const idleHTML = '<span class="text-gray-500 font-medium">Nenhuma música reproduzindo no momento.</span>';
            document.getElementById('split-lyrics-content').innerHTML = idleHTML;
            document.getElementById('fs-lyrics-content').innerHTML = idleHTML;

            isPlayingState = false;
            currentTrackId = null;
            updatePlayPauseIcon(false);
            clearInterval(progressInterval);
        }

        async function updatePlayerUI(data) {
            if (!data || !data.item) {
                setIdleState();
                return;
            }

            const track = data.item;
            const isPlaying = data.is_playing;
            isPlayingState = isPlaying;

            if (currentTrackId !== track.id) {
                currentTrackId = track.id;
                await fetchLyrics(track.name, track.artists[0].name, track.album.name, Math.floor(track.duration_ms / 1000));
            }

            const trackNameStr = track.name;
            const artistNameStr = track.artists.map(a => a.name).join(', ');

            document.getElementById('track-name').innerText = trackNameStr;
            document.getElementById('artist-name').innerText = artistNameStr;
            document.getElementById('fs-track-title').innerText = trackNameStr;
            document.getElementById('fs-artist-title').innerText = artistNameStr;

            const albumImg = track.album.images[0]?.url || '';
            if (document.getElementById('sleeve-img').src !== albumImg) {
                document.getElementById('sleeve-img').src = albumImg;
                document.getElementById('vinyl-center-img').src = albumImg;
            }

            const vinyl = document.getElementById('vinyl-record');
            if (isPlaying) vinyl.classList.remove('paused');
            else vinyl.classList.add('paused');

            updatePlayPauseIcon(isPlaying);

            trackDuration = track.duration_ms;
            trackProgress = data.progress_ms;
            updateProgressUI();

            if (isPlaying) {
                startProgressTicker();
            } else {
                clearInterval(progressInterval);
            }

            highlightCurrentLyric(trackProgress);
        }

        async function fetchLyrics(trackName, artistName, albumName, duration) {
            const loadingHTML = '<span class="text-gray-400 animate-pulse font-medium">Buscando letra sincronizada...</span>';
            document.getElementById('split-lyrics-content').innerHTML = loadingHTML;
            document.getElementById('fs-lyrics-content').innerHTML = loadingHTML;
            lyricsData = null;

            try {
                const url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artistName)}&track_name=${encodeURIComponent(trackName)}&album_name=${encodeURIComponent(albumName)}&duration=${duration}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    const errHTML = '<span class="text-gray-500">Letra não encontrada para esta faixa.</span>';
                    document.getElementById('split-lyrics-content').innerHTML = errHTML;
                    document.getElementById('fs-lyrics-content').innerHTML = errHTML;
                    return;
                }

                const data = await response.json();
                
                if (data.syncedLyrics) {
                    lyricsData = parseLrc(data.syncedLyrics);
                    renderLyricsHTML();
                } else if (data.plainLyrics) {
                    lyricsData = data.plainLyrics.split('\n').map((text, idx) => ({ time: idx * 3000, text }));
                    renderLyricsHTML();
                } else {
                    const instHTML = '<span class="text-gray-500">Letra instrumental ou indisponível.</span>';
                    document.getElementById('split-lyrics-content').innerHTML = instHTML;
                    document.getElementById('fs-lyrics-content').innerHTML = instHTML;
                }
            } catch (err) {
                const errHTML = '<span class="text-gray-500">Erro ao carregar a letra.</span>';
                document.getElementById('split-lyrics-content').innerHTML = errHTML;
                document.getElementById('fs-lyrics-content').innerHTML = errHTML;
            }
        }

        function parseLrc(lrcString) {
            const lines = lrcString.split('\n');
            const parsed = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

            for (let line of lines) {
                const match = timeReg.exec(line);
                if (match) {
                    const mins = parseInt(match[1], 10);
                    const secs = parseInt(match[2], 10);
                    const ms = parseInt(match[3].padEnd(3, '0'), 10);
                    const totalMs = (mins * 60 + secs) * 1000 + ms;
                    const text = line.replace(timeReg, '').trim();
                    parsed.push({ time: totalMs, text: text });
                }
            }
            return parsed;
        }

        function renderLyricsHTML() {
            if (!lyricsData || lyricsData.length === 0) return;

            let html = '<div class="space-y-6 py-4">';
            lyricsData.forEach((item, index) => {
                html += `<p id="lyric-line-${index}" class="lyric-item transition-all duration-300 text-gray-500 text-base font-medium leading-relaxed">${item.text || '&bull;&bull;&bull;'}</p>`;
            });
            html += '</div>';

            document.getElementById('split-lyrics-content').innerHTML = html;
            document.getElementById('fs-lyrics-content').innerHTML = html;
        }

        function highlightCurrentLyric(currentTimeMs) {
            if (!lyricsData || lyricsData.length === 0) return;

            let activeIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTimeMs >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            for (let i = 0; i < lyricsData.length; i++) {
                const splitLine = document.getElementById(`split-lyrics-content`)?.querySelector(`#lyric-line-${i}`);
                const fsLine = document.getElementById(`fs-lyrics-content`)?.querySelector(`#lyric-line-${i}`);

                const elements = [splitLine, fsLine].filter(Boolean);
                elements.forEach(lineEl => {
                    if (currentLyricsMode === 'minimal') {
                        if (i === activeIndex) {
                            lineEl.className = 'lyric-item transition-all duration-300 text-spotify font-bold text-2xl scale-105 my-8';
                            lineEl.style.display = 'block';
                        } else {
                            lineEl.style.display = 'none';
                        }
                    } else if (currentLyricsMode === 'poetry') {
                        lineEl.style.display = 'block';
                        if (i === activeIndex) {
                            lineEl.className = 'lyric-item transition-all duration-300 text-spotify font-semibold text-base my-2 scale-102';
                        } else {
                            lineEl.className = 'lyric-item transition-all duration-300 text-gray-400 text-sm my-2';
                        }
                    } else {
                        lineEl.style.display = 'block';
                        if (i === activeIndex) {
                            lineEl.className = 'lyric-item transition-all duration-300 text-spotify font-extrabold text-lg my-4 scale-105 drop-shadow-[0_0_12px_rgba(29,185,84,0.4)]';
                        } else if (Math.abs(i - activeIndex) === 1) {
                            lineEl.className = 'lyric-item transition-all duration-300 text-gray-300 text-base font-medium my-2 opacity-80';
                        } else {
                            lineEl.className = 'lyric-item transition-all duration-300 text-gray-600 text-sm font-medium my-2 opacity-30';
                        }
                    }
                });
            }

            if (activeIndex !== -1) {
                const activeSplit = document.getElementById(`split-lyrics-content`)?.querySelector(`#lyric-line-${activeIndex}`);
                const activeFs = document.getElementById(`fs-lyrics-content`)?.querySelector(`#lyric-line-${activeIndex}`);

                if (activeSplit && isSplitLayoutActive) {
                    const box = document.getElementById('split-lyrics-box');
                    box.scrollTo({ top: activeSplit.offsetTop - box.clientHeight / 2 + activeSplit.clientHeight / 2, behavior: 'smooth' });
                }
                if (activeFs) {
                    const boxFs = document.getElementById('fs-lyrics-box');
                    boxFs.scrollTo({ top: activeFs.offsetTop - boxFs.clientHeight / 2 + activeFs.clientHeight / 2, behavior: 'smooth' });
                }
            }
        }

        function setLyricsMode(mode) {
            currentLyricsMode = mode;
            document.querySelectorAll('.lyric-mode-btn').forEach(btn => {
                if (btn.dataset.mode === mode) {
                    btn.classList.add('bg-gray-800');
                } else {
                    btn.classList.remove('bg-gray-800');
                }
            });
            highlightCurrentLyric(trackProgress);
        }

        function toggleSplitLayout() {
            isSplitLayoutActive = !isSplitLayoutActive;
            const container = document.getElementById('player-layout-container');
            const splitPane = document.getElementById('split-lyrics-pane');
            const btnText = document.getElementById('split-btn-text');

            if (isSplitLayoutActive) {
                container.classList.remove('max-w-md');
                container.classList.add('max-w-4xl', 'lg:flex-row', 'lg:space-x-6');
                splitPane.classList.remove('hidden');
                splitPane.classList.add('flex');
                btnText.innerText = 'Ocultar Divisão';
                setTimeout(() => highlightCurrentLyric(trackProgress), 100);
            } else {
                container.classList.remove('max-w-4xl', 'lg:flex-row', 'lg:space-x-6');
                container.classList.add('max-w-md');
                splitPane.classList.remove('flex');
                splitPane.classList.add('hidden');
                btnText.innerText = 'Dividir Tela';
            }
        }

        function toggleFullscreenLyricsModal(open) {
            const modal = document.getElementById('fullscreen-lyrics-modal');
            if (open) {
                modal.classList.remove('hidden');
                setTimeout(() => highlightCurrentLyric(trackProgress), 100);
            } else {
                modal.classList.add('hidden');
            }
        }

        function updatePlayPauseIcon(isPlaying) {
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function startProgressTicker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (isPlayingState) {
                    trackProgress += 1000;
                    if (trackProgress > trackDuration) trackProgress = trackDuration;
                    updateProgressUI();
                    highlightCurrentLyric(trackProgress);
                }
            }, 1000);
        }

        function updateProgressUI() {
            const currentSecs = Math.floor(trackProgress / 1000);
            const totalSecs = Math.floor(trackDuration / 1000);

            document.getElementById('current-time').innerText = formatTime(currentSecs);
            document.getElementById('total-time').innerText = formatTime(totalSecs);

            const percentage = trackDuration > 0 ? (trackProgress / trackDuration) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        async function getActiveDeviceId() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/devices', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    const activeDevice = data.devices.find(d => d.is_active) || data.devices[0];
                    return activeDevice ? activeDevice.id : null;
                }
            } catch (err) {}
            return null;
        }

        async function togglePlayPause() {
            const endpoint = isPlayingState ? 'pause' : 'play';
            const deviceId = await getActiveDeviceId();
            let url = `https://api.spotify.com/v1/me/player/${endpoint}`;
            if (deviceId && endpoint === 'play') url += `?device_id=${deviceId}`;

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.status === 401) { await refreshAccessToken(); return; }
                setTimeout(fetchCurrentPlayback, 400);
            } catch (err) {}
        }

        async function controlPlayback(action) {
            const deviceId = await getActiveDeviceId();
            let url = `https://api.spotify.com/v1/me/player/${action}`;
            if (deviceId) url += `?device_id=${deviceId}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.status === 401) { await refreshAccessToken(); return; }
                setTimeout(fetchCurrentPlayback, 500);
            } catch (err) {}
        }

        async function seekTrack(event) {
            const container = document.getElementById('progress-container');
            const rect = container.getBoundingClientRect();
            const seekPos = Math.floor(trackDuration * ((event.clientX - rect.left) / rect.width));

            const deviceId = await getActiveDeviceId();
            let url = `https://api.spotify.com/v1/me/player/seek?position_ms=${seekPos}`;
            if (deviceId) url += `&device_id=${deviceId}`;

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.ok) {
                    trackProgress = seekPos;
                    updateProgressUI();
                    highlightCurrentLyric(trackProgress);
                }
            } catch (err) {}
        }

        function setTheme(theme) {
            const vinyl = document.getElementById('vinyl-record');
            vinyl.classList.remove('vinyl-grooves', 'vinyl-gold', 'vinyl-cyber');
            if (theme === 'classic') vinyl.classList.add('vinyl-grooves');
            if (theme === 'gold') vinyl.classList.add('vinyl-gold');
            if (theme === 'cyber') vinyl.classList.add('vinyl-cyber');

            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.theme === theme) btn.classList.add('bg-gray-800');
                else btn.classList.remove('bg-gray-800');
            });
        }
    </script>
</body>
