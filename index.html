<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Vinyl & Immersive Lyrics</title>
    <!-- Google Fonts Plus Jakarta Sans + FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        spotify: '#1DB954',
                        spotifyDark: '#121212',
                        bgCustom: '#86F46F',
                        cardBg: '#ffffff',
                        borderCustom: '#111111',
                        pinkCustom: '#DF39F4',
                        blueCustom: '#B05CF2',
                        yellowCustom: '#F5EA48'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #86F46F;        
            --card-bg: #ffffff;
            --border-color: #111111;
            --border-width: 3px;
            --box-shadow: 4px 4px 0px #111111;
            --box-shadow-lg: 6px 6px 0px #111111;
            --pink: #DF39F4;          
            --blue: #B05CF2;          
            --yellow: #F5EA48;        
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            font-family: var(--font-body);
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 20s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }
        .vinyl-grooves {
            background: repeating-radial-gradient(
                circle at center,
                #111 0px,
                #111 2px,
                #222 3px,
                #111 4px
            );
        }
        .vinyl-gold {
            background: repeating-radial-gradient(
                circle at center,
                #2a2200 0px,
                #2a2200 2px,
                #daa520 3px,
                #1a1400 4px
            );
        }
        .vinyl-cyber {
            background: repeating-radial-gradient(
                circle at center,
                #0b0f19 0px,
                #0b0f19 2px,
                #00f0ff 3px,
                #110022 4px
            );
        }
        
        .brutal-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--box-shadow-lg);
        }

        .brutal-btn {
            background: var(--pink);
            color: #fff;
            border: 3px solid var(--border-color);
            font-weight: 700;
            box-shadow: 3px 3px 0px #111;
            transition: all 0.1s ease;
            border-radius: 10px;
        }
        .brutal-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0px #111;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border: 2px solid var(--card-bg);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#86F46F] text-[#111111] min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 selection:bg-[#DF39F4] selection:text-white">

    <!-- Cabeçalho -->

        <div class="brutal-card bg-white px-4 py-2 flex items-center space-x-2">
            <svg class="w-6 h-6 sm:w-7 sm:h-7 text-[#DF39F4]" viewBox="0 0 24 24" fill="currentColor">

            </svg>
            <span class="font-extrabold text-base sm:text-lg tracking-wider text-[#111111]">Vinyl<span class="text-[#DF39F4]">Player</span></span>
        </div>
        
        <!-- Controles do Header -->
        <div class="flex items-center space-x-2 sm:space-x-3">
            <button id="split-toggle-btn" onclick="toggleSplitLayout()" class="hidden lg:flex text-xs brutal-card bg-white hover:bg-gray-50 text-[#111111] px-3 py-2 font-bold items-center space-x-1.5 shadow-[2px_2px_0px_#111]" title="Dividir tela com letras">
                <svg class="w-4 h-4 text-[#DF39F4]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4m10-16h4a2 2 0 012 2v12a2 2 0 01-2 2h-4m-10 0V4m10 0v16"></path></svg>
                <span id="split-btn-text">Dividir Tela</span>

                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            </button>

            <div id="auth-container"></div>

    </header>

                            <svg id="play-icon" class="w-6 h-6 sm:w-7 sm:h-7 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

            <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-3">
                <div class="flex space-x-1 bg-gray-100 p-1 rounded-xl border-2 border-[#111] text-[11px] sm:text-xs">
                    <button onclick="setLyricsMode('karaoke')" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-[#DF39F4] text-white font-bold transition lyric-mode-btn" data-mode="karaoke">Karaokê</button>
                    <button onclick="setLyricsMode('poetry')" class="px-2.5 sm:px-3 py-1.5 rounded-lg hover:bg-gray-200 text-[#111] font-bold transition lyric-mode-btn" data-mode="poetry">Poema</button>
                    <button onclick="setLyricsMode('minimal')" class="px-2.5 sm:px-3 py-1.5 rounded-lg hover:bg-gray-200 text-[#111] font-bold transition lyric-mode-btn" data-mode="minimal">Minimal</button>
                </div>
                <button onclick="toggleFullscreenLyricsModal(false)" class="p-2 sm:p-2.5 bg-[#F5EA48] hover:bg-yellow-400 text-[#111] border-2 border-[#111] rounded-xl font-bold transition shadow-[2px_2px_0px_#111]">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <div id="fs-lyrics-box" class="flex-1 overflow-y-auto py-48 sm:py-64 px-4 text-center relative scroll-smooth flex flex-col items-center">
            <div id="fs-lyrics-content" class="w-full max-w-xl text-gray-600 font-bold text-sm sm:text-base">Carregando letra...</div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="w-full max-w-5xl text-center py-3 text-[11px] sm:text-xs text-[#111] font-bold z-20">
        Spotify Vinyl & LRCLIB Dynamic Integration
    </footer>

    <!-- Lógica JavaScript Atualizada para o Custom Scheme -->
    <script>
        const clientId = 'c17b8a32ee1249ef976034607a115409';
        
        // Detecta se está rodando no app nativo do Cordova (file://) ou no Navegador Web comum
        const isCordova = window.location.protocol === 'file:';
        const redirectUri = isCordova 
            ? 'meuspitchapp://callback' 
            : window.location.origin + window.location.pathname;

        const scopes = 'user-read-playback-state user-read-currently-playing user-modify-playback-state';

        let accessToken = localStorage.getItem('spotify_access_token');
        let refreshToken = localStorage.getItem('spotify_refresh_token');
        let tokenExpiry = localStorage.getItem('spotify_token_expiry');
        let isPlayingState = false;
        let progressInterval = null;
        let trackDuration = 0;
        let trackProgress = 0;
        let currentTrackId = null;
        let lyricsData = null;
        let currentLyricsMode = 'karaoke';
        let isSplitLayoutActive = false;

        window.addEventListener('DOMContentLoaded', async () => {
            // Captura o código de autenticação (funciona tanto na web via query params quanto no app custom scheme se interceptado)
            const params = new URLSearchParams(window.location.search);
            let code = params.get('code');

            // Caso especial para capturar parâmetros caso venha pelo custom scheme do Android (ex: meuspitchapp://callback?code=...)
            if (!code && window.location.href.includes('code=')) {
                try {
                    const urlParams = new URLSearchParams(window.location.href.split('?')[1]);
                    code = urlParams.get('code');
                } catch (e) {}
            }

            if (code) {
                if (!isCordova) {
                    window.history.replaceState({}, document.title, redirectUri);
                }
                await exchangeCodeForToken(code);
            } else if (accessToken) {
                if (tokenExpiry && Date.now() > parseInt(tokenExpiry)) {
                    await refreshAccessToken();
                } else {
                    showPlayer();
                }
            } else {
                showLogin();
            }

            document.getElementById('login-btn').addEventListener('click', redirectToSpotifyLogin);
        });

        async function redirectToSpotifyLogin() {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const randomString = (length) => Array.from(crypto.getRandomValues(new Uint8Array(length))).map(x => possible[x % possible.length]).join('');
            
            const codeVerifier = randomString(64);
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

            localStorage.setItem('spotify_code_verifier', codeVerifier);

            const authUrl = new URL('https://accounts.spotify.com/authorize');
            authUrl.searchParams.append('client_id', clientId);
            authUrl.searchParams.append('response_type', 'code');
            authUrl.searchParams.append('redirect_uri', redirectUri);
            authUrl.searchParams.append('code_challenge_method', 'S256');
            authUrl.searchParams.append('code_challenge', codeChallenge);
            authUrl.searchParams.append('scope', scopes);

            // Se for Cordova, idealmente abrimos o navegador externo para o login redirecionar de volta via intent
            if (isCordova && window.cordova && window.cordova.InAppBrowser) {
                // Se preferir usar o InAppBrowser:
                // const browser = cordova.InAppBrowser.open(authUrl.toString(), '_system', 'location=yes');
            }
            
            window.location.href = authUrl.toString();
        }

        async function exchangeCodeForToken(code) {
            const codeVerifier = localStorage.getItem('spotify_code_verifier');
            if (!codeVerifier) { showLogin(); return; }

            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: redirectUri,
                        code_verifier: codeVerifier,
                    }),
                });
                const data = await response.json();
                if (data.access_token) {
                    saveTokens(data);
                    showPlayer();
                } else { showLogin(); }
            } catch (err) { showLogin(); }
        }

        async function refreshAccessToken() {
            if (!refreshToken) { showLogin(); return; }
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: clientId,
                        grant_type: 'refresh_token',
                        refresh_token: refreshToken,
                    }),
                });
                const data = await response.json();
                if (data.access_token) { saveTokens(data); } else { showLogin(); }
            } catch (err) { showLogin(); }
        }

        function saveTokens(data) {
            accessToken = data.access_token;
            localStorage.setItem('spotify_access_token', accessToken);
            if (data.refresh_token) {
                refreshToken = data.refresh_token;
                localStorage.setItem('spotify_refresh_token', refreshToken);
            }
            if (data.expires_in) {
                const expiryTime = Date.now() + (data.expires_in * 1000);
                tokenExpiry = expiryTime;
                localStorage.setItem('spotify_token_expiry', expiryTime);
            }
        }

        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('player-screen').classList.add('hidden');
            document.getElementById('fullscreen-lyrics-trigger').classList.add('hidden');
            document.getElementById('split-toggle-btn').classList.add('hidden');
        }

        function showPlayer() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('player-screen').classList.remove('hidden');
            document.getElementById('fullscreen-lyrics-trigger').classList.remove('hidden');
            document.getElementById('split-toggle-btn').classList.remove('hidden');
            
            document.getElementById('auth-container').innerHTML = `
                <button onclick="logout()" class="text-xs font-bold text-[#111] bg-white hover:bg-gray-100 border-2 border-[#111] px-3 py-1.5 rounded-lg transition shadow-[2px_2px_0px_#111]">Sair</button>
            `;
            fetchCurrentPlayback();
            setInterval(fetchCurrentPlayback, 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = isCordova ? 'index.html' : redirectUri;
        }

        async function fetchCurrentPlayback() {
            if (!accessToken) return;

            try {
                const response = await fetch('https://api.spotify.com/v1/me/player', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.status === 401) {
                    await refreshAccessToken();
                    return;
                }

                if (response.status === 204 || response.status > 400) {
                    setIdleState();
                    return;
                }

                const data = await response.json();
                updatePlayerUI(data);
            } catch (err) {
                console.error('Erro ao buscar player:', err);
            }
        }

        function setIdleState() {
            document.getElementById('track-name').innerText = 'Nenhuma música tocando';
            document.getElementById('artist-name').innerText = 'Abra o Spotify e dê play';
            document.getElementById('vinyl-record').classList.add('paused');
            document.getElementById('sleeve-img').src = '';
            document.getElementById('vinyl-center-img').src = '';
            
            const idleHTML = '<span class="text-gray-500 font-bold">Nenhuma música reproduzindo no momento.</span>';
            document.getElementById('split-lyrics-content').innerHTML = idleHTML;
            document.getElementById('fs-lyrics-content').innerHTML = idleHTML;

            isPlayingState = false;
            currentTrackId = null;
            updatePlayPauseIcon(false);
            clearInterval(progressInterval);
        }

        async function updatePlayerUI(data) {
            if (!data || !data.item) {
                setIdleState();
                return;
            }

            const track = data.item;
            const isPlaying = data.is_playing;
            isPlayingState = isPlaying;

            if (currentTrackId !== track.id) {
                currentTrackId = track.id;
                await fetchLyrics(track.name, track.artists[0].name, track.album.name, Math.floor(track.duration_ms / 1000));
            }

            const trackNameStr = track.name;
            const artistNameStr = track.artists.map(a => a.name).join(', ');

            document.getElementById('track-name').innerText = trackNameStr;
            document.getElementById('artist-name').innerText = artistNameStr;
            document.getElementById('fs-track-title').innerText = trackNameStr;
            document.getElementById('fs-artist-title').innerText = artistNameStr;

            const albumImg = track.album.images[0]?.url || '';
            if (document.getElementById('sleeve-img').src !== albumImg) {
                document.getElementById('sleeve-img').src = albumImg;
                document.getElementById('vinyl-center-img').src = albumImg;
            }

            const vinyl = document.getElementById('vinyl-record');
            if (isPlaying) vinyl.classList.remove('paused');
            else vinyl.classList.add('paused');

            updatePlayPauseIcon(isPlaying);

            trackDuration = track.duration_ms;
            trackProgress = data.progress_ms;
            updateProgressUI();

            if (isPlaying) {
                startProgressTicker();
            } else {
                clearInterval(progressInterval);
            }

            highlightCurrentLyric(trackProgress);
        }

        async function fetchLyrics(trackName, artistName, albumName, duration) {
            const loadingHTML = '<span class="text-gray-500 animate-pulse font-bold">Buscando letra sincronizada...</span>';
            document.getElementById('split-lyrics-content').innerHTML = loadingHTML;
            document.getElementById('fs-lyrics-content').innerHTML = loadingHTML;
            lyricsData = null;

            try {
                const url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artistName)}&track_name=${encodeURIComponent(trackName)}&album_name=${encodeURIComponent(albumName)}&duration=${duration}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    const errHTML = '<span class="text-gray-500 font-bold">Letra não encontrada para esta faixa.</span>';
                    document.getElementById('split-lyrics-content').innerHTML = errHTML;
                    document.getElementById('fs-lyrics-content').innerHTML = errHTML;
                    return;
                }

                const data = await response.json();
                
                if (data.syncedLyrics) {
                    lyricsData = parseLrc(data.syncedLyrics);
                    renderLyricsHTML();
                } else if (data.plainLyrics) {
                    lyricsData = data.plainLyrics.split('\n').map((text, idx) => ({ time: idx * 3000, text }));
                    renderLyricsHTML();
                } else {
                    const instHTML = '<span class="text-gray-500 font-bold">Letra instrumental ou indisponível.</span>';
                    document.getElementById('split-lyrics-content').innerHTML = instHTML;
                    document.getElementById('fs-lyrics-content').innerHTML = instHTML;
                }
            } catch (err) {
                const errHTML = '<span class="text-gray-500 font-bold">Erro ao carregar a letra.</span>';
                document.getElementById('split-lyrics-content').innerHTML = errHTML;
                document.getElementById('fs-lyrics-content').innerHTML = errHTML;
            }
        }

        function parseLrc(lrcString) {
            const lines = lrcString.split('\n');
            const parsed = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

            for (let line of lines) {
                const match = timeReg.exec(line);
                if (match) {
                    const mins = parseInt(match[1], 10);
                    const secs = parseInt(match[2], 10);
                    const ms = parseInt(match[3].padEnd(3, '0'), 10);
                    const totalMs = (mins * 60 + secs) * 1000 + ms;
                    const text = line.replace(timeReg, '').trim();
                    parsed.push({ time: totalMs, text: text });
                }
            }
            return parsed;
        }

        function renderLyricsHTML() {
            if (!lyricsData || lyricsData.length === 0) return;

            let html = '<div class="space-y-6 py-4">';
            lyricsData.forEach((item, index) => {
                html += `<p id="lyric-line-${index}" class="lyric-item transition-all duration-300 text-gray-400 text-sm sm:text-base font-bold leading-relaxed">${item.text || '&bull;&bull;&bull;'}</p>`;
            });
            html += '</div>';

            document.getElementById('split-lyrics-content').innerHTML = html;
            document.getElementById('fs-lyrics-content').innerHTML = html;
        }

        function highlightCurrentLyric(currentTimeMs) {
            if (!lyricsData || lyricsData.length === 0) return;

            let activeIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTimeMs >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            for (let i = 0; i < lyricsData.length; i++) {
                const splitLine = document.getElementById(`split-lyrics-content`)?.querySelector(`#lyric-line-${i}`);
                const fsLine = document.getElementById(`fs-lyrics-content`)?.querySelector(`#lyric-line-${i}`);

                const elements = [splitLine, fsLine].filter(Boolean);
                elements.forEach(lineEl => {
                    if (currentLyricsMode === 'minimal') {
                        if (i === activeIndex) {
                            lineEl.className = 'lyric-item transition-all duration-300 text-[#DF39F4] font-extrabold text-xl sm:text-2xl scale-105 my-8';
                            lineEl.style.display = 'block';
                        } else {
                            lineEl.style.display = 'none';
                        }
                    } else if (currentLyricsMode === 'poetry') {
                        lineEl.style.display = 'block';
                        if (i === activeIndex) {
                            lineEl.className = 'lyric-item transition-all duration-300 text-[#DF39F4] font-bold text-sm sm:text-base my-2 scale-102';
                        } else {
                            lineEl.className = 'lyric-item transition-all duration-300 text-gray-500 text-xs sm:text-sm my-2';
                        }
                    } else {
                        lineEl.style.display = 'block';
                        if (i === activeIndex) {
                            lineEl.className = 'lyric-item transition-all duration-300 text-[#DF39F4] font-extrabold text-base sm:text-lg my-4 scale-105';
                        } else if (Math.abs(i - activeIndex) === 1) {
                            lineEl.className = 'lyric-item transition-all duration-300 text-gray-800 text-sm sm:text-base font-bold my-2 opacity-90';
                        } else {
                            lineEl.className = 'lyric-item transition-all duration-300 text-gray-400 text-xs sm:text-sm font-bold my-2 opacity-40';
                        }
                    }
                });
            }

            if (activeIndex !== -1) {
                const activeSplit = document.getElementById(`split-lyrics-content`)?.querySelector(`#lyric-line-${activeIndex}`);
                const activeFs = document.getElementById(`fs-lyrics-content`)?.querySelector(`#lyric-line-${activeIndex}`);

                if (activeSplit && isSplitLayoutActive) {
                    const box = document.getElementById('split-lyrics-box');
                    box.scrollTo({ top: activeSplit.offsetTop - box.clientHeight / 2 + activeSplit.clientHeight / 2, behavior: 'smooth' });
                }
                if (activeFs) {
                    const boxFs = document.getElementById('fs-lyrics-box');
                    boxFs.scrollTo({ top: activeFs.offsetTop - boxFs.clientHeight / 2 + activeFs.clientHeight / 2, behavior: 'smooth' });
                }
            }
        }

        function setLyricsMode(mode) {
            currentLyricsMode = mode;
            document.querySelectorAll('.lyric-mode-btn').forEach(btn => {
                if (btn.dataset.mode === mode) {
                    btn.classList.add('bg-[#DF39F4]', 'text-white');
                    btn.classList.remove('hover:bg-gray-200', 'text-[#111]');
                } else {
                    btn.classList.remove('bg-[#DF39F4]', 'text-white');
                    btn.classList.add('hover:bg-gray-200', 'text-[#111]');
                }
            });
            highlightCurrentLyric(trackProgress);
        }

        function toggleSplitLayout() {
            isSplitLayoutActive = !isSplitLayoutActive;
            const container = document.getElementById('player-layout-container');
            const splitPane = document.getElementById('split-lyrics-pane');
            const btnText = document.getElementById('split-btn-text');

            if (isSplitLayoutActive) {
                container.classList.remove('max-w-md');
                container.classList.add('max-w-4xl', 'lg:flex-row', 'lg:space-x-8');
                splitPane.classList.remove('hidden');
                splitPane.classList.add('flex');
                btnText.innerText = 'Ocultar Divisão';
                setTimeout(() => highlightCurrentLyric(trackProgress), 100);
            } else {
                container.classList.remove('max-w-4xl', 'lg:flex-row', 'lg:space-x-8');
                container.classList.add('max-w-md');
                splitPane.classList.remove('flex');
                splitPane.classList.add('hidden');
                btnText.innerText = 'Dividir Tela';
            }
        }

        function toggleFullscreenLyricsModal(open) {
            const modal = document.getElementById('fullscreen-lyrics-modal');
            if (open) {
                modal.classList.remove('hidden');
                setTimeout(() => highlightCurrentLyric(trackProgress), 100);
            } else {
                modal.classList.add('hidden');
            }
        }

        function updatePlayPauseIcon(isPlaying) {
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function startProgressTicker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (isPlayingState) {
                    trackProgress += 1000;
                    if (trackProgress > trackDuration) trackProgress = trackDuration;
                    updateProgressUI();
                    highlightCurrentLyric(trackProgress);
                }
            }, 1000);
        }

        function updateProgressUI() {
            const currentSecs = Math.floor(trackProgress / 1000);
            const totalSecs = Math.floor(trackDuration / 1000);

            document.getElementById('current-time').innerText = formatTime(currentSecs);
            document.getElementById('total-time').innerText = formatTime(totalSecs);

            const percentage = trackDuration > 0 ? (trackProgress / trackDuration) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        async function getActiveDeviceId() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/devices', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    const activeDevice = data.devices.find(d => d.is_active) || data.devices[0];
                    return activeDevice ? activeDevice.id : null;
                }
            } catch (err) {}
            return null;
        }

        async function togglePlayPause() {
            const endpoint = isPlayingState ? 'pause' : 'play';
            const deviceId = await getActiveDeviceId();
            let url = `https://api.spotify.com/v1/me/player/${endpoint}`;
            if (deviceId && endpoint === 'play') url += `?device_id=${deviceId}`;

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.status === 401) { await refreshAccessToken(); return; }
                setTimeout(fetchCurrentPlayback, 400);
            } catch (err) {}
        }

        async function controlPlayback(action) {
            const deviceId = await getActiveDeviceId();
            let url = `https://api.spotify.com/v1/me/player/${action}`;
            if (deviceId) url += `?device_id=${deviceId}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.status === 401) { await refreshAccessToken(); return; }
                setTimeout(fetchCurrentPlayback, 500);
            } catch (err) {}
        }

        async function seekTrack(event) {
            const container = document.getElementById('progress-container');
            const rect = container.getBoundingClientRect();
            const seekPos = Math.floor(trackDuration * ((event.clientX - rect.left) / rect.width));

            const deviceId = await getActiveDeviceId();
            let url = `https://api.spotify.com/v1/me/player/seek?position_ms=${seekPos}`;
            if (deviceId) url += `&device_id=${deviceId}`;

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (response.ok) {
                    trackProgress = seekPos;
                    updateProgressUI();
                    highlightCurrentLyric(trackProgress);
                }
            } catch (err) {}
        }

        function setTheme(theme) {
            const vinyl = document.getElementById('vinyl-record');
            vinyl.classList.remove('vinyl-grooves', 'vinyl-gold', 'vinyl-cyber');
            if (theme === 'classic') vinyl.classList.add('vinyl-grooves');
            if (theme === 'gold') vinyl.classList.add('vinyl-gold');
            if (theme === 'cyber') vinyl.classList.add('vinyl-cyber');

            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.theme === theme) {
                    btn.classList.add('bg-[#DF39F4]', 'text-white');
                    btn.classList.remove('hover:bg-gray-200', 'text-[#111]');
                } else {
                    btn.classList.remove('bg-[#DF39F4]', 'text-white');
                    btn.classList.add('hover:bg-gray-200', 'text-[#111]');
                }
            });
        }
    </script>
